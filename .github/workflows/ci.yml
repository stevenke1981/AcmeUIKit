name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Rustup reads rust-toolchain.toml, including its required components.
      # Do not install a second channel that disagrees with local development.
      - name: Install repository Rust toolchain
        run: rustup show
      - name: Report Rust versions
        run: |
          rustc --version --verbose
          cargo --version
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev libfontconfig1-dev libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
